<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>정책검색 — 연결 끊김</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
       font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       background:#eef2f0;color:#15201b}
  @media (prefers-color-scheme:dark){body{background:#0f1513;color:#e6eeea}}
  .box{max-width:360px;text-align:center}
  h1{font-size:19px;margin:0 0 10px}
  p{margin:0 0 20px;line-height:1.6;color:#5d6a64;font-size:15px}
  @media (prefers-color-scheme:dark){p{color:#9aa8a1}}
  button{font:inherit;font-weight:700;padding:13px 22px;border:0;border-radius:12px;
         background:#0d6b4d;color:#fff}
</style>
<div class="box">
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>단가는 항상 최신으로만 보여 드리기 때문에,<br>연결이 없으면 옛 단가를 띄우지 않습니다.<br>
     전파가 잡히면 아래를 눌러 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
