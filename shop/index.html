<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>청춘대길 휴대폰 견적</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e3e1db;--acc:#1f5f8b;--acc2:#e8f0f6}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#202020;--ink:#ecebe7;--mute:#a09e98;--line:#333;--acc:#79b4dd;--acc2:#1f2d38}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:16px;background:var(--card);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}label:first-child{margin-top:0}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:0;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--acc2);border-radius:12px;padding:12px}.kpi .l{font-size:13px;color:var(--mute)}.kpi .v{font-size:23px;font-weight:700}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;white-space:nowrap}
.note{font-size:12px;color:var(--mute)}.minus{color:#b3412f}
</style>
</head>
<body>
<header><h1>청춘대길 휴대폰 견적</h1><p id="made"></p></header>
<main>
<section class="card">
  <label>통신사</label><div class="seg" id="car"></div>
  <label>가입 방식</label><div class="seg" id="jt"></div>
  <label>모델</label><select id="model"></select>
  <label>요금제</label><select id="plan"></select>
  <label>할인 방식</label><div class="seg" id="me"></div>
  <label>할부</label><div class="seg" id="tm"></div>
  <label>부가서비스</label><div class="seg" id="bg"></div>
</section>
<section class="card">
  <div class="big"><div class="kpi"><div class="l">할부원금</div><div class="v" id="kP"></div></div><div class="kpi"><div class="l">월 예상 납부액</div><div class="v" id="kM"></div></div></div>
  <table id="tb" style="margin-top:10px"></table>
  <p class="note" id="nt"></p>
</section>
<p class="note" style="padding:0 4px">견적은 안내용이며 실제 금액은 개통 시점 정책·통신사 청구서 기준으로 달라질 수 있습니다. 요금제·부가서비스는 정해진 기간 유지 조건이 있으며 매장에서 자세히 안내해 드립니다.</p>
</main>
<script>
const $=id=>document.getElementById(id);const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const S={car:'SK',jt:'기변',me:'공시',tm:24,bg:1};let D=null;
const CN={SK:'SK텔레콤',KT:'KT',LG:'LG U+'};
function seg(id,opts,k){const el=$(id);el.innerHTML='';opts.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.className=S[k]===v?'on':'';b.onclick=()=>{S[k]=v;if(k==='car')fill();seg(id,opts,k);run()};el.appendChild(b)})}
function inst(P,n){if(P<=0)return 0;const r=0.059/12;return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)}
function fill(){const ms=Object.entries(D.models).filter(([k])=>k.startsWith(S.car+'|')).sort((a,b)=>b[1].price-a[1].price);
 $('model').innerHTML=ms.map(([k,v])=>`<option value="${k.split('|')[1]}">${v.pet} (${Math.round(v.price/1e4)}만원)</option>`).join('');
 const ps=D.plans[S.car].filter(p=>!/다이렉트|태블릿|워치|스마트기기|데이터쉐어링/.test(p[0])).sort((a,b)=>b[1]-a[1]);const top=(D.topNames[S.car]||[]).filter(Boolean);
 $('plan').innerHTML=ps.map((p,i)=>`<option value="${i}">${p[0]} · 월 ${p[1].toLocaleString()}원</option>`).join('');$('plan')._ps=ps;
 const ti=ps.findIndex(p=>p[0]===top[0]);$('plan').value=String(ti>=0?ti:0)}
function run(){const m=$('model').value,mo=D.models[S.car+'|'+m];const p=$('plan')._ps[+$('plan').value];if(!mo||!p)return;
 const gs=S.me==='공시'?((mo.gs[S.jt]||{})[p[3]]||0):0;const d=D.disc[`${S.car}|${m}|${S.jt}${S.me}|${p[2]}`]||[0,0];const add=S.bg?d[0]:d[1];
 const P=Math.max(0,mo.price-gs-add);const dc=S.me==='선약'?0.25:0;const im=inst(P,S.tm);const fee=p[1]*(1-dc);const M=im+fee;
 $('kP').textContent=won(P);$('kM').textContent=won(M);
 $('tb').innerHTML=`<tr><td>출고가</td><td>${won(mo.price)}</td></tr>`+(gs?`<tr><td>공시지원금</td><td class="minus">−${won(gs)}</td></tr>`:'')+(add?`<tr><td>청춘대길 추가 할인</td><td class="minus">−${won(add)}</td></tr>`:'')+
  `<tr><td><b>할부원금</b></td><td><b>${won(P)}</b></td></tr><tr><td>월 할부금 (${S.tm}개월, 연 5.9%)</td><td>${won(im)}</td></tr><tr><td>요금제 ${p[0]}${dc?' (선택약정 25% 할인)':''}</td><td>${won(fee)}</td></tr><tr><td><b>월 예상 납부액</b></td><td><b>${won(M)}</b></td></tr>`;
 $('nt').textContent=(S.bg?'부가서비스 가입 조건 할인이 포함된 금액입니다. 부가서비스 요금은 월 납부액에 별도로 붙으며 일정 기간 뒤 해지할 수 있습니다. ':'')+(add===0?'이 조건은 추가 할인이 없습니다. ':'')}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{D=j;$('made').textContent=`단가 기준 ${j.made} · 시험판`;
 seg('car',[['SK','SK'],['KT','KT'],['LG','LG U+']],'car');seg('jt',[['010','신규'],['MNP','번호이동'],['기변','기기변경']],'jt');seg('me',[['공시','공시지원금'],['선약','선택약정 25%']],'me');seg('tm',[[24,'24개월'],[36,'36개월']],'tm');seg('bg',[[1,'가입'],[0,'가입 안 함']],'bg');
 fill();['model','plan'].forEach(i=>$(i).onchange=run);run()}).catch(()=>{$('made').textContent='견적 자료를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'});
</script>
</body>
</html>
